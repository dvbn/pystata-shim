name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run smoke tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/smoke -q
